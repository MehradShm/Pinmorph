[project]
name = "pinmorph"
version = "0.1.0"
description = "A learning-oriented Pinterest-style recommendation system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "boto3>=1.38,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=5.2,<7",
    "rq>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = ["integration: requires running Postgres, Redis, MinIO, and an RQ worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
