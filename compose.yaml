name: pinmorph

x-app: &app
  image: ${APP_IMAGE:-pinmorph-app:local}
  build:
    context: .
    target: base
  environment: &app-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pinmorph}:${POSTGRES_PASSWORD:-pinmorph-local}@postgres:5432/${POSTGRES_DB:-pinmorph}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-pinmorph}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pinmorph-local-storage}
    S3_BUCKET: ${S3_BUCKET:-pinmorph-media}
    LENS_ENDPOINT: http://lens:8090
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    FEED_CONFIG: '${FEED_CONFIG:-{}}'
    DISCOVERY_CONFIG: '${DISCOVERY_CONFIG:-{}}'
    ADS_CONFIG: '${ADS_CONFIG:-{}}'
    SIM_MODE: "false"
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    TRUSTED_ORIGINS: '${TRUSTED_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://127.0.0.1:5173"]}'

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinmorph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinmorph-local}
      POSTGRES_DB: ${POSTGRES_DB:-pinmorph}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: pinmorph-minio:2025-10-15
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pinmorph}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pinmorph-local-storage}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  init-storage:
    <<: *app
    command: ["python", "-m", "scripts.init_storage"]
    depends_on:
      minio:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      init-storage:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      lens:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=10)"]
      interval: 10s
      timeout: 12s
      retries: 6

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      init-storage:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      lens:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-pinmorph-web:local}
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

  lens:
    image: pinmorph-lens:local
    build: ./infra/lens
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:${LENS_PORT:-8090}:8090"]
    volumes: ["./data/models:/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.27.9
    ports: ["127.0.0.1:${SMTP_PORT:-1025}:1025", "127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: ["mailpit-data:/data"]

  digest-worker:
    <<: *app
    command: ["python", "-m", "app.product.digest_worker"]
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  checks:
    <<: *app
    image: ${CHECKS_IMAGE:-pinmorph-checks:local}
    build:
      context: .
      target: checks
    profiles: ["checks"]

  analytics-worker:
    <<: *app
    command: ["python", "-m", "app.monetization.worker"]
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
